name: Check Notebooks Output Using nbstripout

on:
  workflow_dispatch:

jobs:
  check-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Check notebooks are stripped using nbstripout
        uses: kynan/nbstripout@main
        with:
          paths: '**/*.ipynb'
